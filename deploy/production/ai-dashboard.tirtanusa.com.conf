<VirtualHost *:80>
    ServerName ai-dashboard.tirtanusa.com
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ai-dashboard.tirtanusa.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:18095/
    ProxyPassReverse / http://127.0.0.1:18095/

    ErrorLog ${APACHE_LOG_DIR}/ai-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/ai-dashboard-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/tirtanusa/cert.pem
    SSLCertificateKeyFile /etc/ssl/tirtanusa/key.pem
</VirtualHost>
</IfModule>
