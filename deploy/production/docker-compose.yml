services:
  app:
    build:
      context: ./current
      dockerfile: docker/php/Dockerfile
    container_name: ai-dashboard-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - ./shared/.env
    volumes:
      - ./current:/var/www/html:ro
      - ./shared/storage:/var/www/html/storage
      - ./shared/bootstrap-cache:/var/www/html/bootstrap/cache
      - ./shared/.env:/var/www/html/.env:ro
    command: >
      sh -lc "mkdir -p /var/www/html/storage/app/public
      /var/www/html/storage/framework/cache/data
      /var/www/html/storage/framework/sessions
      /var/www/html/storage/framework/testing
      /var/www/html/storage/framework/views
      /var/www/html/storage/logs
      /var/www/html/bootstrap/cache
      && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
      && php-fpm"
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-dashboard-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18095:80"
    volumes:
      - ./current:/var/www/html:ro
      - ./shared/storage:/var/www/html/storage
      - ./current/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: ai-dashboard-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ai_dashboard}
      MYSQL_USER: ${DB_USERNAME:-ai_dashboard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-password}
    volumes:
      - ./shared/db-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: ai-dashboard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./shared/redis-data:/data
